openapi: 3.0.3
info:
  description: "OpenAPI specification aligned with the current Nexconn public documentation,\
    \ PDF source documents, and generated SDK requirements."
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Nexconn Server API
  version: 0.1.0
tags:
- description: "User lifecycle, authentication, soft delete, bans, direct-channel\
    \ mute, and user tag operations. Core capabilities align with the official User\
    \ management module."
  name: UserManagement
- description: "User blocklist add, remove, and query operations. Aligns with the\
    \ official User blocklist module."
  name: UserBlocklist
- description: Hosted user profile management APIs. This capability is currently not
    separately listed in the public endpoint list.
  name: UserProfileHosting
- description: Friend relationship and friend permission management APIs.
  name: Friendship
- description: "Channel tags, attributes, and notification settings. Aligns with the\
    \ official Channel management module."
  name: ChannelManagement
- description: "System message send, broadcast, push, and broadcast-recall flows.\
    \ Aligns with the official System messages module."
  name: SystemMessages
- description: "Message sending, updating, recall, history cleanup, and message metadata\
    \ APIs. Aligns with the official Message management module."
  name: MessageManagement
- description: "Group channel lifecycle, member, alias, profile, admin, and favorite\
    \ management APIs."
  name: GroupChannelManagement
- description: "Group channel mute, freeze, and allowed-sender control APIs. Aligns\
    \ with the official Group channel mute and freeze module."
  name: GroupChannelModeration
- description: "Community channel lifecycle, subchannel, private-subchannel member,\
    \ and user-group management APIs."
  name: CommunityChannelManagement
- description: "Community channel mute, freeze, and allowed-sender control APIs. This\
    \ capability is not currently listed in the public endpoint list."
  name: CommunityChannelModeration
- description: Open channel lifecycle and destroy-policy APIs. Aligns with the official
    Open channel management module.
  name: OpenChannelManagement
- description: "Open channel participant, mute, ban, freeze, global mute, and allowed-sender\
    \ APIs. Aligns with the official Open channel participants and moderation module."
  name: OpenChannelParticipantsModeration
- description: Open channel metadata (KV) APIs. Aligns with the official Open channel
    metadata (KV) module.
  name: OpenChannelMetadata
- description: Low-priority open-channel message type APIs. Aligns with the official
    Open channel message priority module.
  name: OpenChannelMessagePriority
- description: Open-channel priority sender and priority message type APIs. Aligns
    with the official Open channel priority senders and priority messages module.
  name: OpenChannelPriorityControls
- description: Profanity word moderation APIs. This capability is not currently listed
    in the public endpoint list.
  name: Moderation
paths:
  /v4/auth/access-token/issue:
    post:
      description: "Rate limit: 200/sec."
      externalDocs:
        description: Official documentation
        url: https://docs.nexconn.ai/platform-chat-api/user/register
      operationId: issueAccessToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessTokenIssueRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenIssueResponse"
          description: OK
      security:
      - NexconnSignature: []
      summary: Register a user
      tags:
      - UserManagement
